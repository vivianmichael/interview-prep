site_name: Interview Prep Question Bank

theme:
  name: material
  font:                       # new
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

extra_css:                    # new
  - stylesheets/extra.css

markdown_extensions:
  - md_in_html                # new
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - tables
  - toc:
      permalink: true


nav:
  - Home: index.md
  - Java:
      - Java exceptions: java-exceptions.md
      - Java concurrency: java-concurrency.md
      - Java garbage collection: java-gc.md
  - Spring (Boot): spring.md
  - System Design: system-design.md
  - DSA: dsa.md